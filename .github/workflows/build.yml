name: Build catalog
on:
  push:
    branches: [main]
    paths: ["extensions/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Commit catalog.json if it changed
        run: |
          if ! git diff --quiet -- catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "catalog.json from the entries" -- catalog.json
            git push
          fi
