name: Check entries
# Every pull request, so it can be a required check; one that changes no entry passes at once.
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the changed entries
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'extensions/*.json')
          if [ -z "$files" ]; then echo "No entries changed."; exit 0; fi
          node scripts/check.mjs "origin/${{ github.base_ref }}" $files
