name: Check entries
on:
  pull_request:
    paths: ["extensions/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the changed entries
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'extensions/*.json')
          node scripts/check.mjs "origin/${{ github.base_ref }}" $files
